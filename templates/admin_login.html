<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - ELECO</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding-top: 100px; text-align: center; }
        .login-card { background: white; max-width: 350px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 95%; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #c82333; }
        .error { color: red; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🛡️ ELECO Portal Login</h2>
        <p>Restricted Access: Authorized Personnel Only</p>
        <form action="/admin/login" method="POST">
            <input type="password" name="password" placeholder="Enter Admin Password" required>
            <button type="submit">Log In to Dashboard</button>
        </form>
    </div>
</body>
</html>
