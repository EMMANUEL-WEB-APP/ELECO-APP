<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Departmental Election Portal</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f7f6; }
        .card { background: white; max-width: 400px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 95%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Voter Pre-Registration</h2>
        <form action="/register" method="POST">
            <input type="text" name="matric_no" placeholder="Enter Matriculation No. (e.g. RAD/21/001)" required>
            <input type="email" name="email" placeholder="Enter your email address" required>
            <button type="submit">Pre-Register to Vote</button>
        </form>
    </div>
</body>
</html>
