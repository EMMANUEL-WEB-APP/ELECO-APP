<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Official Ballot - ELECO</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .position-box { background: #f9fafb; border: 1px solid #e5e7eb; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        .position-title { font-weight: bold; color: #1f2937; margin-bottom: 10px; font-size: 16px; }
        label { display: block; margin: 8px 0; cursor: pointer; }
        button { display: block; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🗳️ Official Departmental Ballot</h2>
        <p style="text-align: center; color: #6b7280;">Please select one candidate for each executive position below.</p>
        
        <form action="/ballot" method="POST">
            {% for position, candidates in positions.items() %}
            <div class="position-box">
                <div class="position-title">{{ position }}</div>
                {% for candidate in candidates %}
                <label>
                    <input type="radio" name="{{ position }}" value="{{ candidate }}" required> {{ candidate }}
                </label>
                {% endfor %}
            </div>
            {% endfor %}
            
            <button type="submit">Submit Final Ballot</button>
        </form>
    </div>
</body>
</html>
