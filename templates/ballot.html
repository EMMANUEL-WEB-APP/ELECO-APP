<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voting Ballot - ELECO</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .position-block { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        h4 { margin-top: 0; color: #007bff; }
        label { display: block; margin: 8px 0; cursor: pointer; font-size: 15px; }
        button { display: block; width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🗳️ Official Electronic Ballot</h2>
        <p style="text-align: center; color: #666;">Select one candidate for each position, then submit your final ballot.</p>
        
        <form action="/ballot" method="POST">
            {% for position, candidates in positions.items() %}
            <div class="position-block">
                <h4>{{ position }}</h4>
                {% for candidate in candidates %}
                <label>
                    <input type="radio" name="{{ position }}" value="{{ candidate }}" required> {{ candidate }}
                </label>
                {% endfor %}
            </div>
            {% endfor %}
            
            <button type="submit" onclick="return confirm('Are you sure you want to submit your final vote? This action cannot be undone.');">Submit Final Ballot</button>
        </form>
    </div>
</body>
</html>
